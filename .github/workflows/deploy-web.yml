name: Deploy web (Vercel)
# trigger 1
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_NAME: kod-universe

jobs:
  # ====================================
  # DEV DEPLOYMENT → Vercel Preview
  # ====================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}" >> .env
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project=${{ env.VERCEL_PROJECT_NAME }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Info (Preview)
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        run: |
          vercel deploy \
            --prebuilt \
            --target=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

  # ====================================
  # PROD DEPLOYMENT → Vercel Production
  # ====================================
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}" >> .env
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project=${{ env.VERCEL_PROJECT_NAME }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Info (Production)
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
